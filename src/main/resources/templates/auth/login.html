<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 p-4" style="max-width: 420px; width: 100%">
        <h2 class="text-center mb-4">Вход в аккаунт</h2>

        <div class="alert alert-danger" th:if="${param.error}">
            Неверный логин или пароль.
        </div>

        <div class="alert alert-success" th:if="${param.logout}">
            Вы вышли из аккаунта.
        </div>

        <div class="alert alert-success" th:if="${param.registered}">
            Регистрация успешна! Теперь войдите.
        </div>

        <form method="post" th:action="@{/auth/login}">
            <div class="mb-3">
                <label class="form-label" for="username">Логин</label>
                <input autocomplete="username" class="form-control" id="username"
                       name="username" required
                       type="text">
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Пароль</label>
                <input autocomplete="current-password" class="form-control" id="password"
                       name="password" required
                       type="password">
            </div>

            <button class="btn btn-primary w-100" type="submit">
                Войти
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Нет аккаунта?
            <a th:href="@{/auth/register}">Регистрация</a>
        </p>
    </div>
</div>

</body>
</html>
