<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="card shadow-sm border-0 p-4" style="max-width: 460px; width: 100%">
        <h2 class="text-center mb-4">Создать аккаунт</h2>

        <div class="alert alert-danger"
             th:if="${registrationError}"
             th:text="${registrationError}"></div>

        <form method="post" th:action="@{/auth/register}" th:object="${form}">

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input autocomplete="email" class="form-control" id="email"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       th:field="*{email}"
                       type="email">
                <div class="invalid-feedback"
                     th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Пароль</label>
                <input autocomplete="new-password" class="form-control" id="password"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                       th:field="*{password}"
                       type="password">
                <div class="invalid-feedback"
                     th:errors="*{password}"></div>
                <div class="form-text">Не менее 8 символов.</div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="confirmPassword">
                    Повторите пароль
                </label>
                <input autocomplete="new-password" class="form-control"
                       id="confirmPassword"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                       th:field="*{confirmPassword}"
                       type="password">
                <div class="invalid-feedback"
                     th:errors="*{confirmPassword}"></div>
            </div>

            <button class="btn btn-primary w-100" type="submit">
                Зарегистрироваться
            </button>
        </form>

        <p class="text-center mt-3 mb-0">
            Уже есть аккаунт?
            <a th:href="@{/auth/login}">Войти</a>
        </p>
    </div>
</div>

</body>
</html>
