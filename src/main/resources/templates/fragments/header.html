<!DOCTYPE html>
<html lang="ru"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="header">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Навигация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid">

        <!-- Название сайта и роль -->
        <a class="navbar-brand" th:href="@{/}">
            Contract Management System

            <span sec:authorize="hasRole('MANAGER')">
                (Менеджер)
            </span>

            <span sec:authorize="hasRole('CONTRACTOR')">
                (Подрядчик)
            </span>

            <span sec:authorize="hasRole('CLIENT_ORG')">
                (Заказчик)
            </span>
        </a>

        <ul class="navbar-nav ms-auto flex-row align-items-center gap-3">

            <!-- Менеджер -->
            <li class="nav-item"
                sec:authorize="hasRole('MANAGER')">
                <a class="nav-link text-white"
                   th:href="@{/requests/full-requests}">
                    Заявки
                </a>
            </li>

            <li class="nav-item"
                sec:authorize="hasRole('MANAGER')">
                <a class="nav-link text-white"
                   th:href="@{/requests/statistics}">
                    Статистика
                </a>
            </li>

            <li class="nav-item"
                sec:authorize="hasRole('MANAGER')">
                <a class="nav-link text-white"
                   th:href="@{/client-org/tariffs}">
                    Управление тарифами
                </a>
            </li>

            <li class="nav-item"
                sec:authorize="hasRole('MANAGER')">
                <a class="nav-link text-white"
                   th:href="@{/positions}">
                    Управление должностями
                </a>
            </li>

            <!-- Подрядчик -->
            <li class="nav-item"
                sec:authorize="hasRole('CONTRACTOR')">
                <a class="nav-link text-white"
                   th:href="@{/requests}">
                    Заявки
                </a>
            </li>


            <li class="nav-item"
                sec:authorize="hasRole('CONTRACTOR')">
                <a class="nav-link text-white"
                   th:href="@{/contractor/bids/my-bids}">
                    Мои отклики
                </a>
            </li>

            <li class="nav-item"
                sec:authorize="hasRole('CONTRACTOR')">
                <a class="nav-link text-white"
                   th:href="@{/contractor/my-shifts}">
                    Мои смены
                </a>
            </li>

            <li class="nav-item"
                sec:authorize="hasRole('CONTRACTOR')">
                <a class="nav-link text-white"
                   th:href="@{/client-org/become}">
                    Стать заказчиком
                </a>
            </li>

            <!-- Заказчик -->
            <li class="nav-item"
                sec:authorize="hasRole('CLIENT_ORG')">
                <a class="nav-link text-white"
                   th:href="@{/requests/client-org}">
                    Мои заявки
                </a>
            </li>

            <!-- Заказчик -->
            <li class="nav-item"
                sec:authorize="hasRole('CLIENT_ORG')">
                <a class="nav-link text-white"
                   th:href="@{/requests/new}">
                    Создать заявку
                </a>
            </li>

            <!-- Имя пользователя -->
            <li class="nav-item ms-2">
                <span class="navbar-text text-white">
                    <span sec:authentication="name"></span>
                </span>
            </li>

            <!-- Выход -->
            <li class="nav-item">
                <form method="post" th:action="@{/logout}">
                    <button class="btn btn-outline-light btn-sm"
                            type="submit">
                        Выйти
                    </button>
                </form>
            </li>

        </ul>
    </div>
</nav>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
