<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои заявки</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<!-- Навигация -->
<nav th:replace="~{fragments/header :: header}"></nav>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Мои заявки</h1>
            <p class="text-muted mb-0">
                Управляйте созданными заявками и просматривайте отклики.
            </p>
        </div>
    </div>

    <!-- Единственное общее пустое состояние -->
    <div class="card border-0 shadow-sm"
         th:if="${#lists.isEmpty(requests)}">
        <div class="card-body text-center py-5">
            <h2 class="h5 mb-2">Пока нет заявок</h2>
            <p class="text-muted mb-3">
                Здесь будут отображаться созданные вами заявки.
            </p>
            <a class="btn btn-primary" th:href="@{/requests/new}">
                Создать первую заявку
            </a>
        </div>
    </div>

    <!-- Вкладки отображаются только при наличии заявок -->
    <div th:unless="${#lists.isEmpty(requests)}">

        <!-- Навигация по статусам -->
        <ul class="nav nav-tabs mb-4" id="requestTabs" role="tablist">

            <li class="nav-item" role="presentation">
                <button class="nav-link active"
                        id="all-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#all"
                        type="button"
                        role="tab">
                    Все
                    <span class="badge text-bg-secondary ms-1"
                          th:text="${#lists.size(requests)}">0</span>
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="open-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#open"
                        type="button"
                        role="tab">
                    Открытые
                    <span class="badge text-bg-primary ms-1"
                          th:text="${#lists.size(requests.?[status.name() == 'OPEN'])}">0</span>
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="agreed-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#agreed"
                        type="button"
                        role="tab">
                    Согласованные
                    <span class="badge text-bg-success ms-1"
                          th:text="${#lists.size(requests.?[status.name() == 'AGREED'])}">0</span>
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="expired-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#expired"
                        type="button"
                        role="tab">
                    Истёкшие
                    <span class="badge text-bg-secondary ms-1"
                          th:text="${#lists.size(requests.?[status.name() == 'EXPIRED'])}">0</span>
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="cancelled-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#cancelled"
                        type="button"
                        role="tab">
                    Отменённые
                    <span class="badge text-bg-danger ms-1"
                          th:text="${#lists.size(requests.?[status.name() == 'CANCELLED'])}">0</span>
                </button>
            </li>

            <li class="nav-item" role="presentation">
                <button class="nav-link"
                        id="closed-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#closed"
                        type="button"
                        role="tab">
                    Закрытые
                    <span class="badge text-bg-dark ms-1"
                          th:text="${#lists.size(requests.?[status.name() == 'CLOSED'])}">0</span>
                </button>
            </li>

        </ul>

        <!-- Содержимое вкладок -->
        <div class="tab-content" id="requestTabsContent">

            <!-- Все заявки -->
            <div class="tab-pane fade show active"
                 id="all"
                 role="tabpanel"
                 aria-labelledby="all-tab"
                 tabindex="0">

                <div th:replace="~{fragments/request-cards :: requestCards(${requests})}"></div>

            </div>

            <!-- Открытые -->
            <div class="tab-pane fade"
                 id="open"
                 role="tabpanel"
                 aria-labelledby="open-tab"
                 tabindex="0">

                <div th:replace="~{fragments/request-cards :: requestCards(${requests.?[status.name() == 'OPEN']})}"></div>

            </div>

            <!-- Согласованные -->
            <div class="tab-pane fade"
                 id="agreed"
                 role="tabpanel"
                 aria-labelledby="agreed-tab"
                 tabindex="0">

                <div th:replace="~{fragments/request-cards :: requestCards(${requests.?[status.name() == 'AGREED']})}"></div>

            </div>

            <!-- Истёкшие -->
            <div class="tab-pane fade"
                 id="expired"
                 role="tabpanel"
                 aria-labelledby="expired-tab"
                 tabindex="0">

                <div th:replace="~{fragments/request-cards :: requestCards(${requests.?[status.name() == 'EXPIRED']})}"></div>

            </div>

            <!-- Отменённые -->
            <div class="tab-pane fade"
                 id="cancelled"
                 role="tabpanel"
                 aria-labelledby="cancelled-tab"
                 tabindex="0">

                <div th:replace="~{fragments/request-cards :: requestCards(${requests.?[status.name() == 'CANCELLED']})}"></div>

            </div>

            <!-- Закрытые -->
            <div class="tab-pane fade"
                 id="closed"
                 role="tabpanel"
                 aria-labelledby="closed-tab"
                 tabindex="0">

                <div th:replace="~{fragments/request-cards :: requestCards(${requests.?[status.name() == 'CLOSED']})}"></div>

            </div>

        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
