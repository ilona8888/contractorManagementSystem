<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Мои заявки</title>

</head>
<body class="bg-light">

<nav th:replace="fragments/header :: header"></nav>

<main class="container py-4">

    <!--    Оповещение об успешной регистрации как заказчик-->
    <div class="alert alert-success"
         role="alert"
         th:if="${successMessage}"
         th:text="${successMessage}">
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Мои заявки</h1>
            <p class="text-muted mb-0">
                Управляйте заявками и просматривайте отклики исполнителей.
            </p>
        </div>
    </div>

    <div class="card border-0 shadow-sm"
         th:if="${#lists.isEmpty(requests)}">
        <div class="card-body text-center py-5">
            <h2 class="h5 mb-2">Пока нет заявок</h2>
            <p class="text-muted mb-0">
                Здесь будут отображаться созданные вами заявки.
            </p>
        </div>
    </div>

    <!-- Список заявок -->
    <div class="row g-4"
         th:unless="${#lists.isEmpty(requests)}">

        <div class="col-12"
             th:each="request : ${requests}">

            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between
                                align-items-start flex-wrap gap-2 mb-3">

                        <div>
                            <h2 class="h5 mb-1"
                                th:text="${request.positionName}">
                                Название должности
                            </h2>

                        </div>

                        <span class="badge rounded-pill bg-primary"
                              th:text="${request.status}">
                        </span>
                    </div>

                    <div class="row g-3">

                        <div class="col-6 col-md-3">
                            <div class="text-muted small mb-1">
                                Дата работы
                            </div>
                            <div class="fw-semibold"
                                 th:text="${request.workDate}">
                            </div>
                        </div>

                        <div class="col-6 col-md-3">
                            <div class="text-muted small mb-1">
                                Время
                            </div>
                            <div class="fw-semibold">
                                <span th:text="${request.startTime}"></span>
                                –
                                <span th:text="${request.endTime}"></span>
                            </div>
                        </div>

                        <div class="col-6 col-md-3">
                            <div class="text-muted small mb-1">
                                Оплата
                            </div>
                            <div class="fw-semibold">
                                <span th:text="${request.amount}">1000</span>
                                €
                            </div>
                        </div>

                        <div class="col-6 col-md-3">
                            <div class="text-muted small mb-1">
                                Отклики
                            </div>
                            <div class="fw-semibold">
                                <span th:text="${request.bidCount}">0</span>
                            </div>
                        </div>

                    </div>

                    <div class="border-top mt-4 pt-3
                                d-flex justify-content-end">

                        <a class="btn btn-outline-primary"
                           th:href="@{/requests/{id}(id=${request.id})}">
                            Посмотреть отклики
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

</body>
</html>
